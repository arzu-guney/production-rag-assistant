name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cost-conscious defaults: no Gemini secrets, no live LLM evaluation.
permissions:
  contents: read

jobs:
  test:
    name: Fast tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run fast automated tests
        # Exclude @pytest.mark.slow (Sentence Transformer / temporary Chroma cases).
        # Those remain valuable locally but download models and add CI minutes.
        # Never call Gemini and never require GEMINI_API_KEY in CI.
        run: python -m pytest -m "not slow"

      - name: Import check
        run: python -c "from app.main import app; print(app.title)"

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        # Build-only validation. Do not push, deploy, or run Gemini.
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: production-rag-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
